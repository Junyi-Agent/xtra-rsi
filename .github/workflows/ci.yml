name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v10.4.0  # setup-uv 从 v8 起不再发布 vN 浮动 tag
      - run: uv sync --frozen
      - run: uv run --frozen pre-commit run --all-files --show-diff-on-failure
      - name: 下游接入冒烟测试（wheel 安装 + rsi sync）
        run: uv run --frozen python scripts/smoke_downstream.py
