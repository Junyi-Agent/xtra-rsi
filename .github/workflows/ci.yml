name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run --frozen pre-commit run --all-files --show-diff-on-failure
      - name: 下游接入冒烟测试（wheel 安装 + rsi sync）
        run: uv run --frozen python scripts/smoke_downstream.py
