<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RSI 面板</title>
<style>
:root {
  --bg: #f4f5f7; --grid: #e3e6eb; --panel: #ffffff; --panel-2: #f7f8fa; --line: #dfe3e8;
  --text: #1a1d23; --muted: #667085; --faint: #98a2b3; --accent: #3b6fe0; --accent-soft: #dbe6fb;
  --running: #3b6fe0; --done: #1f9d55; --stopped: #c98208; --failed: #d64545; --lost: #b5478f; --unknown: #8a94a6;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 16px rgba(16,24,40,.06);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --grid: #1a1e25; --panel: #171a21; --panel-2: #1d2129; --line: #2a303a;
    --text: #e6e8ec; --muted: #9aa3b2; --faint: #6b7483; --accent: #6b9bff; --accent-soft: #22325a;
    --running: #6b9bff; --done: #3fbf74; --stopped: #e0a63a; --failed: #f06a6a; --lost: #d77bb8; --unknown: #7d8696;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --grid: #1a1e25; --panel: #171a21; --panel-2: #1d2129; --line: #2a303a;
  --text: #e6e8ec; --muted: #9aa3b2; --faint: #6b7483; --accent: #6b9bff; --accent-soft: #22325a;
  --running: #6b9bff; --done: #3fbf74; --stopped: #e0a63a; --failed: #f06a6a; --lost: #d77bb8; --unknown: #7d8696;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
input { -webkit-user-select: text; user-select: text; }
body { -webkit-user-select: none; user-select: none; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif; }

#viewport { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none;
  background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
#viewport.dragging { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

/* 顶栏 */
#bar { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  pointer-events: none; z-index: 5; }
#bar > * { pointer-events: auto; }
.brand { font-weight: 650; letter-spacing: .2px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; box-shadow: var(--shadow); }
.brand small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; box-shadow: var(--shadow); }
.pill { border: 0; background: transparent; color: var(--text); border-radius: 7px; padding: 3px 9px; font: inherit; font-size: 13px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.pill:hover { background: var(--panel-2); }
.pill.off { opacity: .4; }
.pill b { font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
#search { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; font: inherit; width: 200px; box-shadow: var(--shadow); }
.tools { margin-left: auto; display: flex; gap: 6px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; box-shadow: var(--shadow); }
.tools button { border: 0; background: transparent; color: var(--text); border-radius: 7px; padding: 3px 9px; font: inherit; font-size: 13px; cursor: pointer; }
.tools button:hover { background: var(--panel-2); }
#zoom { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 44px; text-align: center; }
#conn { font-size: 12px; color: var(--muted); padding: 0 6px; }
#conn.bad { color: var(--failed); }
#hint { position: fixed; left: 12px; bottom: 12px; color: var(--muted); font-size: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; z-index: 5; }
#empty { position: fixed; inset: 0; display: none; place-items: center; color: var(--muted); text-align: center; z-index: 1; pointer-events: none; }
#empty code { font-family: var(--mono); background: var(--panel); padding: 2px 6px; border-radius: 4px; }

/* 分组标题 */
.glabel { position: absolute; transform: translateY(-100%); padding-bottom: 10px; line-height: 1.1; font-size: 22px; font-weight: 650; color: var(--muted); white-space: nowrap; }
.glabel span { font-weight: 400; font-size: 16px; color: var(--faint); margin-left: 10px; }
.lod-far .glabel { font-size: 64px; }
.lod-far .glabel span { font-size: 40px; }

/* 卡片 */
.card { position: absolute; width: 600px; height: 400px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; cursor: pointer; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--st); }
.card.sel { outline: 3px solid var(--accent); outline-offset: 3px; }
.card.hidden { display: none; }
.lod-far .card .nf, .card .far { display: none; }
.lod-far .card .far { display: flex; }
.lod-mid .card .near-only, .lod-far .card .near-only { display: none; }
.lod-near .card .mid-only { display: none; }

.far { flex-direction: column; justify-content: center; gap: 22px; padding: 30px 36px; height: 100%; }
.far .t { font-size: 58px; font-weight: 700; line-height: 1.15; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all; }
.far .s { font-size: 40px; color: var(--st); font-weight: 650; display: flex; gap: 14px; align-items: center; }
.far .s .dot { width: 26px; height: 26px; }
.far .g { font-size: 32px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.far .big-bar { height: 26px; border-radius: 13px; background: var(--panel-2); overflow: hidden; position: relative; border: 1px solid var(--line); }
.far .big-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--st); }

.hd { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px 10px 24px; }
.hd .ttl { flex: 1; min-width: 0; }
.hd .ttl b { font-size: 24px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hd .ttl small { color: var(--muted); font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { font-size: 15px; font-weight: 600; color: var(--st); background: color-mix(in srgb, var(--st) 14%, transparent); border-radius: 999px; padding: 2px 10px; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.running .chip .dot { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

.goal { margin: 0 18px 0 24px; padding: 8px 14px; background: var(--panel-2); border-radius: 10px; font-size: 16px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
.goal dt { color: var(--muted); }
.goal dd { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.goal .none { grid-column: 1 / -1; color: var(--faint); }

.body { flex: 1; min-height: 0; display: flex; gap: 14px; padding: 10px 16px 8px 20px; }
.ring { flex: none; }
.ring text { font-family: inherit; }
.side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 9px; justify-content: center; }
.kpi { font-size: 15px; }
.kpi .row { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); }
.kpi .row b { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
.bar { height: 7px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); position: relative; overflow: visible; margin-top: 3px; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--accent); }
.bar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); opacity: .55; }
.spark { font-size: 14px; color: var(--muted); }
.ft { padding: 6px 18px 12px 24px; font-size: 13px; color: var(--muted); display: flex; gap: 12px; white-space: nowrap; overflow: hidden; }
.ft .err { color: var(--failed); overflow: hidden; text-overflow: ellipsis; }

/* 近景：每轮 × 五个阶段 */
.grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 30px repeat(5, 1fr); grid-template-rows: 14px; grid-auto-rows: 46px; gap: 3px; font-size: 9px; line-height: 1.3; align-content: start; }
.grid .h { color: var(--muted); font-weight: 600; text-align: center; font-size: 9px; }
.grid .it { color: var(--muted); font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; font-size: 9px; }
.cell { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 3px 4px; overflow: hidden; word-break: break-all; }
.lod-near .goal { font-size: 11px; padding: 5px 10px; }
.lod-near .ft { font-size: 10px; padding-bottom: 8px; }
.cell:hover { border-color: var(--accent); }
.cell.cur { border-color: var(--st); box-shadow: inset 0 0 0 1px var(--st); }
.cell.miss { background: transparent; border-style: dashed; }
.cell .k { color: var(--muted); }
.more { font-size: 9px; color: var(--muted); text-align: center; grid-column: 1 / -1; }

/* 节点 */
.node { position: absolute; width: 440px; height: 270px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
.node::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; border-radius: 16px 0 0 16px; background: var(--st); }
.node .nid { font-size: 18px; font-weight: 700; display: flex; gap: 10px; align-items: center; }
.node .nid small { font-weight: 400; color: var(--muted); font-size: 13px; }
.node .rat { font-size: 12px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.lod-far .node .nf { display: none; }
.lod-far .node .nid { font-size: 56px; }
.node .farg { display: none; font-size: 32px; color: var(--muted); overflow: hidden; display: none; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.lod-far .node .farg { display: -webkit-box; }
.lod-far .node .chip { font-size: 24px; }

/* 抽屉 */
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(680px, 100vw); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(0,0,0,.12); z-index: 10; transform: translateX(102%); transition: transform .18s ease; display: flex; flex-direction: column; }
#drawer.open { transform: none; }
#drawer header { padding: 16px 18px 10px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
#drawer header .ttl { flex: 1; min-width: 0; }
#drawer header b { font-size: 17px; display: block; word-break: break-all; }
#drawer header small { color: var(--muted); display: block; font-family: var(--mono); font-size: 11.5px; word-break: break-all; }
#drawer .x { border: 0; background: var(--panel-2); color: var(--text); border-radius: 8px; width: 30px; height: 30px; font-size: 18px; cursor: pointer; }
#dbody { flex: 1; overflow: auto; padding: 14px 18px 30px; }
.sec { margin-bottom: 16px; }
.sec h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-word; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
.tabs button { border: 1px solid var(--line); background: var(--panel-2); color: var(--text); border-radius: 7px; padding: 3px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
.tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.tabs button.miss { opacity: .45; }
details.ysec { margin: 0 0 10px; }
details.ysec > summary { cursor: pointer; padding: 4px 0; font-size: 13px; }
details.ysec.raw > summary b { font-weight: 500; color: var(--muted); }
pre.y { margin: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: none; }
.ev { border-left: 3px solid var(--line); padding: 4px 10px; margin: 4px 0; font-size: 12.5px; }
.ev .kind { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; margin-right: 6px; }
.ev.tool { border-color: var(--accent); } .ev.tool .kind { color: var(--accent); }
.ev.result { border-color: var(--faint); } .ev.result .kind { color: var(--muted); }
.ev.thinking { border-color: var(--stopped); } .ev.thinking .kind { color: var(--stopped); }
.ev.text .kind { color: var(--done); } .ev.text { border-color: var(--done); }
.ev.error { border-color: var(--failed); } .ev.error .kind { color: var(--failed); }
.ev .txt { white-space: pre-wrap; word-break: break-word; }
.ev details summary { cursor: pointer; color: var(--muted); font-size: 11.5px; }
.ev details pre { font: 11.5px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word; margin: 4px 0 0; background: var(--panel-2); padding: 6px 8px; border-radius: 6px; }
.muted { color: var(--muted); }

/* 抽屉里的图表 */
.chart { margin: 6px 0 12px; }
.chart .ct { font-size: 12.5px; color: var(--muted); margin-bottom: 2px; }
.chart svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.chart text { font-family: inherit; }

/* 内部过程：按会话分块 */
.sess { border: 1px solid var(--line); border-radius: 10px; margin: 0 0 10px; background: var(--panel); }
.sess > summary { list-style: none; cursor: pointer; padding: 8px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sess > summary::-webkit-details-marker { display: none; }
.sess > summary::before { content: "▸"; color: var(--muted); transition: transform .12s; }
.sess[open] > summary::before { transform: rotate(90deg); }
.sess .sn { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
.sess .st { font-weight: 650; }
.sess .meta { color: var(--muted); font-size: 12px; margin-left: auto; }
.badge { font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.badge.fresh { color: var(--done); background: color-mix(in srgb, var(--done) 14%, transparent); }
.badge.cont { color: var(--stopped); background: color-mix(in srgb, var(--stopped) 16%, transparent); }
.badge.run { color: var(--running); background: color-mix(in srgb, var(--running) 14%, transparent); }
.badge.err { color: var(--failed); background: color-mix(in srgb, var(--failed) 14%, transparent); }
.sess .sbody { padding: 0 12px 10px; border-top: 1px solid var(--line); }
.sess .lane { font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .4px; margin: 10px 0 4px; }
.sess .inp { border-left: 3px solid var(--accent); background: var(--panel-2); border-radius: 0 8px 8px 0; margin: 4px 0; }
.sess .inp > summary { cursor: pointer; padding: 5px 10px; font-size: 12.5px; }
.sess .inp pre { margin: 0; padding: 4px 10px 8px; font: 11.5px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 420px; overflow: auto; }
.flow { color: var(--muted); font-size: 12px; text-align: center; margin: -4px 0 6px; }

@media (max-width: 640px) {
  /* 手机：顶栏压成两行，不挡画布 */
  #bar { top: 8px; left: 8px; right: 8px; gap: 6px; }
  .brand { padding: 4px 9px; font-size: 13px; }
  .brand small, #conn, #hint { display: none; }
  .pills { padding: 2px; }
  .pill { font-size: 12px; padding: 2px 7px; }
  #search { flex: 1; min-width: 0; width: auto; padding: 5px 9px; font-size: 13px; }
  .tools { margin-left: 0; padding: 2px; }
  .tools button { padding: 2px 7px; font-size: 12px; }
  #drawer header { padding: 12px 14px 8px; }
  #dbody { padding: 12px 12px 30px; }
}
</style>
</head>
<body>
<div id="viewport"><div id="world"><svg id="edges"></svg></div></div>
<div id="bar">
  <div class="brand">RSI 面板<small id="host"></small></div>
  <div class="pills" id="pills"></div>
  <input id="search" placeholder="搜索标题、目标、路径" autocomplete="off">
  <div class="tools">
    <span id="conn">连接中…</span>
    <button id="fit" title="适配全部（F）">适配全部</button>
    <button id="zout" title="缩小">−</button><span id="zoom">100%</span><button id="zin" title="放大">+</button>
  </div>
</div>
<div id="hint">滚轮 / 双指缩放 · 拖动平移 · 双击卡片聚焦 · 放大到一定程度显示每轮每个阶段 · 点击看详情</div>
<div id="empty"><div>没有找到 loop。<br>用 <code>rsi viz &lt;目录&gt;</code> 指向含 <code>status.yaml</code> 或 <code>iter-*/</code> 的 run 目录。</div></div>
<aside id="drawer"><header><div class="ttl"><b id="dtitle"></b><small id="dpath"></small></div><button class="x" id="dclose" title="关闭（Esc）">×</button></header><div id="dbody"></div></aside>

<script>
"use strict";
const STAGES = ["observe", "reasoning", "decision", "action", "feedback"];
const STAGE_ZH = { observe: "观察", reasoning: "推理", decision: "决策", action: "行动", feedback: "反馈" };
const STATES = {
  running: "运行中", done: "完成", stopped: "已停止", failed: "失败", lost: "失联", unknown: "无状态",
};
const CW = 600, CH = 400, GAP = 56, NW = 440, NH = 270;
const LOD_FAR = 0.4, LOD_NEAR = 1.3;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const stColor = (st) => `var(--${STATES[st] ? st : "unknown"})`;
const store = { get(k) { try { return JSON.parse(localStorage.getItem("rsi-viz:" + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("rsi-viz:" + k, JSON.stringify(v)); } catch { /* 无痕模式等 */ } } };

let data = { loops: [], nodes: [] };
let layoutKey = "";
let pos = {};            // id → {x, y, w, h}
let bounds = { x: 0, y: 0, w: 1, h: 1 };
let view = store.get("view") || null;
let hiddenStates = new Set(store.get("hidden") || []);
let query = "";
const details = {};      // loop id → 摘要 detail
const detailAt = {};
let sel = null;          // {id, iter, stage, tab}
let full = null;

// ---------- 画布：平移、缩放 ----------
const vp = $("#viewport"), world = $("#world");
function apply() {
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
  const lod = view.k < LOD_FAR ? "lod-far" : view.k < LOD_NEAR ? "lod-mid" : "lod-near";
  if (!world.classList.contains(lod)) { world.classList.remove("lod-far", "lod-mid", "lod-near"); world.classList.add(lod); }
  $("#zoom").textContent = Math.round(view.k * 100) + "%";
  store.set("view", view);
  scheduleDetails();
}
function zoomAt(cx, cy, factor) {
  const k = Math.min(5, Math.max(0.04, view.k * factor));
  view.x = cx - (cx - view.x) * (k / view.k);
  view.y = cy - (cy - view.y) * (k / view.k);
  view.k = k; apply();
}
function fitRect(r, pad = 60) {
  const W = vp.clientWidth, H = vp.clientHeight - 60;
  const k = Math.min(5, Math.max(0.04, Math.min((W - pad * 2) / r.w, (H - pad * 2) / r.h)));
  view = { k, x: (W - r.w * k) / 2 - r.x * k, y: 60 + (H - r.h * k) / 2 - r.y * k };
  apply();
}
function animateTo(r) {
  const from = { ...view }; fitRect(r); const to = { ...view }; view = from;
  const t0 = performance.now();
  const step = (t) => {
    const p = Math.min(1, (t - t0) / 260), e = 1 - Math.pow(1 - p, 3);
    view = { k: from.k * Math.pow(to.k / from.k, e), x: from.x + (to.x - from.x) * e, y: from.y + (to.y - from.y) * e };
    apply(); if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
vp.addEventListener("wheel", (e) => {
  e.preventDefault();
  const d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  zoomAt(e.clientX, e.clientY, Math.exp(-d * (e.ctrlKey ? 0.01 : 0.0016)));
}, { passive: false });
// 指针：鼠标 / 单指拖动平移，双指捏合缩放（以两指中点为中心，同时跟随中点平移）
const ptrs = new Map();  // pointerId → {x, y}
let gest = null;         // 当前手势的起点
let suppressClick = false;
function gestStart() {

  const hd = `<div class="hd nf"><div class="ttl"><b>${esc(l.title)}</b><small>${esc(l.subtitle || l.path)}</small></div>
    <span class="chip"><span class="dot" style="background:var(--st)"></span>${stateText(l)}${st === "running" && l.stage ? " · " + (STAGE_ZH[l.stage] || l.stage) : ""}</span></div>
    <dl class="goal nf">${gr.length ? gr.map(([k, v]) => `<dt>${esc(k)}</dt><dd title="${esc(v)}">${esc(v)}</dd>`).join("") : `<span class="none">没有 goal（旧 run 或 profile 没设置 Profile.goal）</span>`}</dl>`;
  const side = `${(l.kpis || []).slice(0, 4).map(kpiHtml).join("")}${(l.series || []).slice(0, 1).map((s) => spark(s)).join("")}`;
  const mid = `<div class="body nf mid-only">${ring(l, 200)}<div class="side">${side || `<div class="muted">没有指标（没有装对应的 viz 插件）</div>`}</div></div>`;
  const near = `<div class="body nf near-only" style="flex-direction:column;gap:6px">${gridHtml(l)}</div>`;
  const ft = `<div class="ft nf">${l.started_at ? `<span>开始 ${esc(l.started_at.replace("T", " ").slice(0, 16))}</span>` : ""}${l.pid ? `<span>pid ${esc(l.pid)}@${esc(l.host)}</span>` : ""}${l.reason ? `<span>原因：${esc(l.reason)}</span>` : ""}${l.error || l.plugin_error ? `<span class="err" title="${esc(l.error || l.plugin_error)}">${esc(l.error || "插件：" + l.plugin_error)}</span>` : ""}</div>`;
  return far + hd + mid + near + ft;
}
function nodeEl(n) {
  const el = document.createElement("div"); el.className = "node"; el.dataset.key = n.key;
  const p = pos[n.key]; el.style.left = p.x + "px"; el.style.top = p.y + "px";
  fillNode(el, n); return el;
}
function nodeSt(s) { return { running: "running", done: "done", proposed: "stopped", pending_approval: "stopped", rejected: "failed", retired: "unknown" }[s] || "unknown"; }
const NODE_ZH = { running: "运行中", done: "完成", proposed: "已提案", pending_approval: "等人审批", rejected: "已拒绝", retired: "已撤销" };
function fillNode(el, n) {
  el.style.setProperty("--st", stColor(nodeSt(n.status)));
  const b = n.budget_usd || 0, sp = n.spent_usd || 0, al = n.allocated_usd || 0;
  el.innerHTML = `<div class="nid">${esc(n.id)}<small>${n.stage ? "改进父节点的" + esc(STAGE_ZH[n.stage] || n.stage) : "根节点"}</small><span class="chip" style="margin-left:auto"><span class="dot" style="background:var(--st)"></span>${esc(NODE_ZH[n.status] || n.status)}</span></div>
    <div class="farg">${esc(n.target)} · ${esc(n.metric)}</div>
    <dl class="goal nf" style="margin:0"><dt>在改进</dt><dd>${esc(n.target)}</dd><dt>指标</dt><dd>${esc(n.metric)}</dd></dl>
    <div class="kpi nf"><div class="row"><span>预算</span><b>$${fmt(sp)} 已花 · $${fmt(al)} 划给子节点 · 共 $${fmt(b)}</b></div>
      <div class="bar"><i style="width:${b ? Math.min(100, (sp / b) * 100) : 0}%"></i><i style="left:${b ? Math.min(100, (sp / b) * 100) : 0}%;width:${b ? Math.min(100, (al / b) * 100) : 0}%;background:var(--stopped);opacity:.6"></i></div></div>
    ${n.rationale ? `<div class="rat nf">${esc(n.rationale)}</div>` : ""}
    <div class="muted nf" style="font-size:12px;margin-top:auto">${(n.loops || []).length} 次运行</div>`;
}
function render() {
  const relaid = layout();
  for (const l of data.loops) {
    const el = world.querySelector(`.card[data-id="${l.id}"]`); if (!el) continue;
    el.className = "card " + (STATES[l.state] ? l.state : "unknown") + (sel && sel.id === l.id ? " sel" : "");
    el.style.setProperty("--st", stColor(l.state));
    el.innerHTML = cardHtml(l);
  }
  for (const n of data.nodes) { const el = world.querySelector(`.node[data-key="${CSS.escape(n.key)}"]`); if (el) fillNode(el, n); }
  renderPills(); filter();
  $("#empty").style.display = data.loops.length || data.nodes.length ? "none" : "grid";
  if (relaid && needFit && (data.loops.length || data.nodes.length)) { fitRect(bounds); needFit = false; } else if (relaid) apply();
}
function renderPills() {
  const counts = {};
  for (const l of data.loops) counts[l.state] = (counts[l.state] || 0) + 1;
  $("#pills").innerHTML = Object.keys(STATES).filter((s) => counts[s]).map((s) =>
    `<button class="pill${hiddenStates.has(s) ? " off" : ""}" data-s="${s}"><span class="dot" style="background:${stColor(s)}"></span>${STATES[s]} <b>${counts[s]}</b></button>`).join("") || `<span class="pill">0 个 loop</span>`;
  for (const b of $("#pills").querySelectorAll("button")) b.onclick = () => {
    const s = b.dataset.s; hiddenStates.has(s) ? hiddenStates.delete(s) : hiddenStates.add(s);
    store.set("hidden", [...hiddenStates]); renderPills(); filter();
  };
}
function filter() {
  for (const l of data.loops) {
    const el = world.querySelector(`.card[data-id="${l.id}"]`); if (!el) continue;
    const hay = [l.title, l.subtitle, l.path, l.group, JSON.stringify(l.goal)].join(" ").toLowerCase();
    el.classList.toggle("hidden", hiddenStates.has(l.state) || (query && !hay.includes(query)));
  }
}

// ---------- 数据 ----------
async function getJSON(url) { const r = await fetch(url, { cache: "no-store" }); if (!r.ok) throw new Error(r.status + " " + url); return r.json(); }
async function poll() {
  try {
    data = await getJSON("/api/loops");
    $("#host").textContent = data.host ? "@ " + data.host : "";
    $("#conn").textContent = "更新于 " + new Date().toLocaleTimeString();
    $("#conn").classList.remove("bad");
    render();
    if (sel) refreshDrawer();
  } catch (e) {
    $("#conn").textContent = "连接失败，重试中"; $("#conn").classList.add("bad");
  }
  setTimeout(poll, 2500);
}
let detailTimer = 0;
function scheduleDetails() { clearTimeout(detailTimer); detailTimer = setTimeout(loadVisibleDetails, 120); }
async function loadVisibleDetails() {
  if (view.k < LOD_NEAR) return;
  const W = vp.clientWidth, H = vp.clientHeight, now = Date.now();
  const want = data.loops.filter((l) => {
    const p = pos[l.id]; if (!p) return false;
    const x = p.x * view.k + view.x, y = p.y * view.k + view.y;
    return x < W && y < H && x + p.w * view.k > 0 && y + p.h * view.k > 0 && (!detailAt[l.id] || now - detailAt[l.id] > 4000);
  }).slice(0, 24);
  await Promise.all(want.map(async (l) => {
    detailAt[l.id] = now;
    try {
      details[l.id] = await getJSON("/api/loop?id=" + encodeURIComponent(l.id));
      const el = world.querySelector(`.card[data-id="${l.id}"] .near-only`);
      if (el) el.innerHTML = gridHtml(l);
    } catch { /* 下一轮再试 */ }
  }));
}
setInterval(scheduleDetails, 4000);

// ---------- 抽屉 ----------
function openDrawer(id, iter, stage) {
  const l = data.loops.find((x) => x.id === id); if (!l) return;
  sel = { id, iter: iter ?? (l.iteration ?? 0), stage: stage || l.stage || "observe", tab: "stage" };
  full = null;
  for (const c of world.querySelectorAll(".card.sel")) c.classList.remove("sel");
  world.querySelector(`.card[data-id="${id}"]`)?.classList.add("sel");
  $("#drawer").classList.add("open");
  drawDrawer(); refreshDrawer();
}
function openNode(n) {
  sel = null; full = null;
  $("#drawer").classList.add("open");
  $("#dtitle").textContent = "节点 " + n.id;
  $("#dpath").textContent = n.key;
  const kv = Object.entries(n).filter(([k]) => k !== "loops" && k !== "key").map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(typeof v === "object" ? JSON.stringify(v) : v)}</dd>`).join("");
  const runs = (n.loops || []).map((id) => { const l = data.loops.find((x) => x.id === id); return l ? `<button data-id="${id}">${esc(l.title)}</button>` : ""; }).join("");
  $("#dbody").innerHTML = `<div class="sec"><h4>节点</h4><dl class="kv">${kv}</dl></div><div class="sec"><h4>运行</h4><div class="tabs">${runs || '<span class="muted">还没有运行</span>'}</div></div>`;
  for (const b of $("#dbody").querySelectorAll("button[data-id]")) b.onclick = () => { const p = pos[b.dataset.id]; if (p) animateTo({ x: p.x - 20, y: p.y - 20, w: p.w + 40, h: p.h + 40 }); openDrawer(b.dataset.id); };
}
function closeDrawer() {
  sel = null; $("#drawer").classList.remove("open");
  for (const c of world.querySelectorAll(".card.sel")) c.classList.remove("sel");
}
$("#dclose").onclick = closeDrawer;
let lastFullKey = "";
async function refreshDrawer() {
  if (!sel) return;
  try {
    const d = await getJSON(`/api/loop?id=${encodeURIComponent(sel.id)}&full=1`);
    const key = JSON.stringify(d);
    if (key === lastFullKey && full) return;
    lastFullKey = key; full = d; drawDrawer();
  } catch { /* 下一轮再试 */ }
}
const secOpen = {};
function yamlHtml(e) {
  // 插件给了 sections：按块显示（各自有标题，可折叠），原始文件放最后折叠
  if (!(e.sections || []).length) return `<pre class="y">${esc(e.yaml)}</pre>`;
  const blocks = [...e.sections, { title: "原始文件", note: "整个阶段输出", collapsed: true, yaml: e.yaml, raw: true }];
  return blocks.map((x) => {
    const k = `${sel.id}/${sel.stage}/${x.title}`;
    const open = k in secOpen ? secOpen[k] : !x.collapsed;
    return `<details class="ysec${x.raw ? " raw" : ""}" data-k="${esc(k)}"${open ? " open" : ""}><summary><b>${esc(x.title)}</b>${x.note ? ` <span class="muted">· ${esc(x.note)}</span>` : ""}</summary><pre class="y">${esc(x.yaml)}</pre></details>`;
  }).join("");
}
// ---------- 内部过程 ----------
// inner 的元素可以是事件 {kind, text, detail?}，也可以是会话 {kind: "session", ...}（见 data.py 文档）
function evHtml(e) {
  return `<div class="ev ${esc(e.kind)}"><span class="kind">${esc(e.kind)}</span><span class="txt">${esc(e.text)}</span>${e.detail ? `<details><summary>展开</summary><pre>${esc(e.detail)}</pre></details>` : ""}</div>`;
}
function sessionsOf(inner) {
  // 旧格式（只有事件）：当成一个没有标题的会话
  if (!inner.some((x) => x && x.kind === "session")) return inner.length ? [{ kind: "session", title: "", events: inner, legacy: true }] : [];
  const out = []; let loose = [];
  for (const x of inner) {
    if (x && x.kind === "session") { if (loose.length) { out.push({ kind: "session", title: "", events: loose, legacy: true }); loose = []; } out.push(x); }
    else loose.push(x);
  }
  if (loose.length) out.push({ kind: "session", title: "", events: loose, legacy: true });
  return out;
}
const sessOpen = {};
function sessionHtml(x, i, keyBase, openByDefault) {
  const evs = x.events || [];
  if (x.legacy) return evs.map(evHtml).join("");
  const k = `${keyBase}/${i}/${x.title}`;
  const open = k in sessOpen ? sessOpen[k] : openByDefault;
  const badges = [];
  if (x.fresh === true) badges.push(`<span class="badge fresh" title="新进程、新会话，不带之前的对话历史；它知道的只有下面的输入">新会话 · 从头开始</span>`);
  else if (x.fresh === false) badges.push(`<span class="badge cont" title="续接之前的会话，带着之前的对话历史">续接${x.resumes ? " " + esc(x.resumes) : "上一会话"}</span>`);
  if (x.status === "running") badges.push(loopRunning ? `<span class="badge run">运行中</span>` : `<span class="badge err" title="loop 已经不在运行，这个会话没有正常结束">未结束</span>`);
  else if (x.status === "error") badges.push(`<span class="badge err">出错</span>`);
  const tools = evs.filter((e) => e.kind === "tool").length;
  const meta = [x.meta, `${evs.length} 条${tools ? ` · ${tools} 次工具调用` : ""}`, x.session ? "session " + String(x.session).slice(0, 8) : ""].filter(Boolean).join(" · ");
  let b = "";
  if ((x.inputs || []).length) {
    b += `<div class="lane">输入 · 会话开始时拿到的全部内容</div>`;
    b += x.inputs.map((inp, j) => {
      const ik = `${k}/in/${j}`, io = ik in sessOpen ? sessOpen[ik] : !inp.collapsed;
      return `<details class="inp" data-k="${esc(ik)}"${io ? " open" : ""}><summary><b>${esc(inp.title)}</b>${inp.note ? ` <span class="muted">· ${esc(inp.note)}</span>` : ""}</summary><pre>${esc(inp.text)}</pre></details>`;
    }).join("");
  }
  b += `<div class="lane">过程</div>${evs.length ? evs.map(evHtml).join("") : '<div class="muted">还没有事件</div>'}`;
  if (x.output) b += `<div class="lane">输出 · 交给下一步</div><div class="inp"><pre>${esc(x.output)}</pre></div>`;
  const stage = x.stage ? (STAGE_ZH[x.stage] || x.stage) : "";
  return `<details class="sess" data-k="${esc(k)}"${open ? " open" : ""}><summary><span class="sn">#${i + 1}</span><span class="st">${esc(x.title || stage || "会话")}</span>${badges.join("")}<span class="meta">${esc(meta)}</span></summary><div class="sbody">${b}</div></details>`;
}
let loopRunning = false;
function innerHtml(list, keyBase, stage) {
  const all = sessionsOf(list);
  const shown = stage ? all.map((x, i) => [x, i]).filter(([x]) => x.stage === stage) : all.map((x, i) => [x, i]);
  if (!shown.length) return "";
  const single = shown.length === 1;
  return shown.map(([x, i], n) => sessionHtml(x, i, keyBase, single) + (!stage && n < shown.length - 1 && !x.legacy ? `<div class="flow">↓</div>` : "")).join("");
}
function drawDrawer() {
  if (!sel) return;
  const l = data.loops.find((x) => x.id === sel.id); if (!l) return;
  $("#dtitle").textContent = l.title;
  $("#dpath").textContent = l.path;
  const body = $("#dbody"), scroll = body.scrollTop;
  const meta = [["状态", stateText(l)], ["当前", l.iteration != null ? `第 ${l.iteration + 1}${l.iterations ? "/" + l.iterations : ""} 轮 · ${STAGE_ZH[l.stage] || l.stage || "-"}` : "-"],
    ["profile", l.profile], ["进程", l.pid ? `${l.pid}@${l.host}` : null], ["开始", l.started_at],
    ["原因", l.reason], ["错误", l.error], ["插件错误", l.plugin_error]].filter(([, v]) => v != null && v !== "");
  const goal = Object.entries(l.goal || {}).map(([k, v]) => `<dt>${esc(k === "target" ? "在改进" : k === "metric" ? "指标" : k)}</dt><dd>${esc(typeof v === "object" ? JSON.stringify(v) : v)}</dd>`).join("");
  let s = `<div class="sec"><h4>目标</h4>${goal ? `<dl class="kv">${goal}</dl>` : '<div class="muted">没有 goal</div>'}</div>`;
  s += `<div class="sec"><h4>运行</h4><dl class="kv">${meta.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div>`;
  if ((l.kpis || []).length || (l.series || []).length) s += `<div class="sec"><h4>指标</h4>${(l.kpis || []).map(kpiHtml).join("")}${(l.series || []).map(chart).join("")}</div>`;
  if (!full) { body.innerHTML = s + '<div class="muted">加载中…</div>'; return; }
  const its = full.iterations || [];
  s += `<div class="sec"><h4>轮次</h4><div class="tabs" id="itabs">${its.map((it) => `<button data-i="${it.iteration}" class="${it.iteration === sel.iter ? "on" : ""}">#${it.iteration + 1}</button>`).join("") || '<span class="muted">还没有阶段输出</span>'}</div>`;
  const it = its.find((x) => x.iteration === sel.iter);
  const inner = (full.inner || {})[String(sel.iter)] || [];
  const sess = sessionsOf(inner), nSess = sess.filter((x) => !x.legacy).length;
  const innerKey = `${sel.id}/${sel.iter}`;
  loopRunning = l.state === "running";
  s += `<div class="tabs" id="stabs">${STAGES.map((st) => `<button data-s="${st}" class="${sel.tab === "stage" && st === sel.stage ? "on" : ""}${it && it.stages[st] && !it.stages[st].pending ? "" : " miss"}">${STAGE_ZH[st]} ${st}</button>`).join("")}${inner.length ? `<button data-s="__inner" class="${sel.tab === "inner" ? "on" : ""}">内部过程 · ${nSess ? nSess + " 个会话" : inner.length}</button>` : ""}</div>`;
  if (sel.tab === "inner") {
    if (nSess) s += `<p class="muted" style="font-size:12px">这一轮按时间顺序的每个会话。每个会话标明是从头开始还是续接，「输入」是它开始时拿到的全部内容（例如上一阶段的交接）。</p>`;
    s += innerHtml(inner, innerKey);
  } else {
    const e = it && it.stages[sel.stage] && !it.stages[sel.stage].pending ? it.stages[sel.stage] : null;
    const pend = it && it.stages[sel.stage] && it.stages[sel.stage].pending ? it.stages[sel.stage].note : "";
    if (pend) s += `<p>${esc(pend)}</p>`;
    s += e ? `${e.note ? `<p>${esc(e.note)}</p>` : ""}<div class="muted" style="font-size:12px;margin-bottom:4px">写入于 ${esc(e.mtime)}</div>${yamlHtml(e)}` : `<div class="muted">${l.state === "running" && l.iteration === sel.iter && l.stage === sel.stage ? "这个阶段正在运行，还没有输出" : "没有这个阶段的输出"}</div>`;
    const own = innerHtml(inner, innerKey, sel.stage);
    if (own) s += `<div class="lane" style="margin-top:14px;font-size:12px;color:var(--muted);font-weight:600">这个阶段的会话</div>${own}`;
  }
  s += "</div>";
  body.innerHTML = s; body.scrollTop = scroll;
  for (const d of body.querySelectorAll("details.ysec")) d.ontoggle = () => { secOpen[d.dataset.k] = d.open; };
  for (const d of body.querySelectorAll("details.sess, details.inp")) d.ontoggle = () => { sessOpen[d.dataset.k] = d.open; };
  for (const b of body.querySelectorAll("#itabs button")) b.onclick = () => { sel.iter = +b.dataset.i; drawDrawer(); };
  for (const b of body.querySelectorAll("#stabs button")) b.onclick = () => { if (b.dataset.s === "__inner") sel.tab = "inner"; else { sel.tab = "stage"; sel.stage = b.dataset.s; } body.scrollTop = 0; drawDrawer(); };
}

let needFit = !view;
if (!view) view = { k: 0.5, x: 40, y: 80 };
apply();
poll();
</script>
</body>
