<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSI 面板</title>
<style>
:root {
  --bg: #f4f5f7; --grid: #e3e6eb; --panel: #ffffff; --panel-2: #f7f8fa; --line: #dfe3e8;
  --text: #1a1d23; --muted: #667085; --faint: #98a2b3; --accent: #3b6fe0; --accent-soft: #dbe6fb;
  --running: #3b6fe0; --done: #1f9d55; --stopped: #c98208; --failed: #d64545; --lost: #b5478f; --unknown: #8a94a6;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 16px rgba(16,24,40,.06);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --grid: #1a1e25; --panel: #171a21; --panel-2: #1d2129; --line: #2a303a;
    --text: #e6e8ec; --muted: #9aa3b2; --faint: #6b7483; --accent: #6b9bff; --accent-soft: #22325a;
    --running: #6b9bff; --done: #3fbf74; --stopped: #e0a63a; --failed: #f06a6a; --lost: #d77bb8; --unknown: #7d8696;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --grid: #1a1e25; --panel: #171a21; --panel-2: #1d2129; --line: #2a303a;
  --text: #e6e8ec; --muted: #9aa3b2; --faint: #6b7483; --accent: #6b9bff; --accent-soft: #22325a;
  --running: #6b9bff; --done: #3fbf74; --stopped: #e0a63a; --failed: #f06a6a; --lost: #d77bb8; --unknown: #7d8696;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
input { -webkit-user-select: text; user-select: text; }
body { -webkit-user-select: none; user-select: none; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif; }

#viewport { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none;
  background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
#viewport.dragging { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

/* 顶栏 */
#bar { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  pointer-events: none; z-index: 5; }
#bar > * { pointer-events: auto; }
.brand { font-weight: 650; letter-spacing: .2px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; box-shadow: var(--shadow); }
.brand small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; box-shadow: var(--shadow); }
.pill { border: 0; background: transparent; color: var(--text); border-radius: 7px; padding: 3px 9px; font: inherit; font-size: 13px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.pill:hover { background: var(--panel-2); }
.pill.off { opacity: .4; }
.pill b { font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
#search { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; font: inherit; width: 200px; box-shadow: var(--shadow); }
.tools { margin-left: auto; display: flex; gap: 6px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; box-shadow: var(--shadow); }
.tools button { border: 0; background: transparent; color: var(--text); border-radius: 7px; padding: 3px 9px; font: inherit; font-size: 13px; cursor: pointer; }
.tools button:hover { background: var(--panel-2); }
#zoom { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 44px; text-align: center; }
#conn { font-size: 12px; color: var(--muted); padding: 0 6px; }
#conn.bad { color: var(--failed); }
#hint { position: fixed; left: 12px; bottom: 12px; color: var(--muted); font-size: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; z-index: 5; }
#empty { position: fixed; inset: 0; display: none; place-items: center; color: var(--muted); text-align: center; z-index: 1; pointer-events: none; }
#empty code { font-family: var(--mono); background: var(--panel); padding: 2px 6px; border-radius: 4px; }

/* 分组标题 */
.glabel { position: absolute; transform: translateY(-100%); padding-bottom: 10px; line-height: 1.1; font-size: 22px; font-weight: 650; color: var(--muted); white-space: nowrap; }
.glabel span { font-weight: 400; font-size: 16px; color: var(--faint); margin-left: 10px; }
.lod-far .glabel { font-size: 64px; }
.lod-far .glabel span { font-size: 40px; }

/* 卡片 */
.card { position: absolute; width: 600px; height: 400px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; cursor: pointer; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--st); }
.card.sel { outline: 3px solid var(--accent); outline-offset: 3px; }
.card.hidden { display: none; }
.lod-far .card .nf, .card .far { display: none; }
.lod-far .card .far { display: flex; }
.lod-mid .card .near-only, .lod-far .card .near-only { display: none; }
.lod-near .card .mid-only { display: none; }

.far { flex-direction: column; justify-content: center; gap: 22px; padding: 30px 36px; height: 100%; }
.far .t { font-size: 58px; font-weight: 700; line-height: 1.15; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all; }
.far .s { font-size: 40px; color: var(--st); font-weight: 650; display: flex; gap: 14px; align-items: center; }
.far .s .dot { width: 26px; height: 26px; }
.far .g { font-size: 32px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.far .big-bar { height: 26px; border-radius: 13px; background: var(--panel-2); overflow: hidden; position: relative; border: 1px solid var(--line); }
.far .big-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--st); }

.hd { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px 10px 24px; }
.hd .ttl { flex: 1; min-width: 0; }
.hd .ttl b { font-size: 24px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hd .ttl small { color: var(--muted); font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { font-size: 15px; font-weight: 600; color: var(--st); background: color-mix(in srgb, var(--st) 14%, transparent); border-radius: 999px; padding: 2px 10px; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.running .chip .dot { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

.goal { margin: 0 18px 0 24px; padding: 8px 14px; background: var(--panel-2); border-radius: 10px; font-size: 16px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
.goal dt { color: var(--muted); }
.goal dd { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.goal .none { grid-column: 1 / -1; color: var(--faint); }

.body { flex: 1; min-height: 0; display: flex; gap: 14px; padding: 10px 16px 8px 20px; }
.ring { flex: none; }
.ring text { font-family: inherit; }
.side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 9px; justify-content: center; }
.kpi { font-size: 15px; }
.kpi .row { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); }
.kpi .row b { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
.bar { height: 7px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); position: relative; overflow: visible; margin-top: 3px; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--accent); }
.bar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); opacity: .55; }
.spark { font-size: 14px; color: var(--muted); }
.ft { padding: 6px 18px 12px 24px; font-size: 13px; color: var(--muted); display: flex; gap: 12px; white-space: nowrap; overflow: hidden; }
.ft .err { color: var(--failed); overflow: hidden; text-overflow: ellipsis; }

/* 近景：每轮 × 五个阶段 */
.grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 30px repeat(5, 1fr); grid-template-rows: 14px; grid-auto-rows: 46px; gap: 3px; font-size: 9px; line-height: 1.3; align-content: start; }
.grid .h { color: var(--muted); font-weight: 600; text-align: center; font-size: 9px; }
.grid .it { color: var(--muted); font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; font-size: 9px; }
.cell { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 3px 4px; overflow: hidden; word-break: break-all; }
.lod-near .goal { font-size: 11px; padding: 5px 10px; }
.lod-near .ft { font-size: 10px; padding-bottom: 8px; }
.cell:hover { border-color: var(--accent); }
.cell.cur { border-color: var(--st); box-shadow: inset 0 0 0 1px var(--st); }
.cell.miss { background: transparent; border-style: dashed; }
.cell .k { color: var(--muted); }
.more { font-size: 9px; color: var(--muted); text-align: center; grid-column: 1 / -1; }

/* 节点 */
.node { position: absolute; width: 440px; height: 270px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
.node::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; border-radius: 16px 0 0 16px; background: var(--st); }
.node .nid { font-size: 18px; font-weight: 700; display: flex; gap: 10px; align-items: center; }
.node .nid small { font-weight: 400; color: var(--muted); font-size: 13px; }
.node .rat { font-size: 12px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.lod-far .node .nf { display: none; }
.lod-far .node .nid { font-size: 56px; }
.node .farg { display: none; font-size: 32px; color: var(--muted); overflow: hidden; display: none; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.lod-far .node .farg { display: -webkit-box; }
.lod-far .node .chip { font-size: 24px; }

/* 抽屉 */
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(680px, 100vw); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(0,0,0,.12); z-index: 10; transform: translateX(102%); transition: transform .18s ease; display: flex; flex-direction: column; }
#drawer.open { transform: none; }
#drawer header { padding: 16px 18px 10px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
#drawer header .ttl { flex: 1; min-width: 0; }
#drawer header b { font-size: 17px; display: block; word-break: break-all; }
#drawer header small { color: var(--muted); display: block; font-family: var(--mono); font-size: 11.5px; word-break: break-all; }
#drawer .x { border: 0; background: var(--panel-2); color: var(--text); border-radius: 8px; width: 30px; height: 30px; font-size: 18px; cursor: pointer; }
#dbody { flex: 1; overflow: auto; padding: 14px 18px 30px; }
.sec { margin-bottom: 16px; }
.sec h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-word; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
.tabs button { border: 1px solid var(--line); background: var(--panel-2); color: var(--text); border-radius: 7px; padding: 3px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
.tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.tabs button.miss { opacity: .45; }
pre.y { margin: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: none; }
.ev { border-left: 3px solid var(--line); padding: 4px 10px; margin: 4px 0; font-size: 12.5px; }
.ev .kind { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; margin-right: 6px; }
.ev.tool { border-color: var(--accent); } .ev.tool .kind { color: var(--accent); }
.ev.result { border-color: var(--faint); } .ev.result .kind { color: var(--muted); }
.ev.thinking { border-color: var(--stopped); } .ev.thinking .kind { color: var(--stopped); }
.ev.text .kind { color: var(--done); } .ev.text { border-color: var(--done); }
.ev.error { border-color: var(--failed); } .ev.error .kind { color: var(--failed); }
.ev .txt { white-space: pre-wrap; word-break: break-word; }
.ev details summary { cursor: pointer; color: var(--muted); font-size: 11.5px; }
.ev details pre { font: 11.5px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word; margin: 4px 0 0; background: var(--panel-2); padding: 6px 8px; border-radius: 6px; }
.muted { color: var(--muted); }

@media (max-width: 640px) {
  #search { width: 130px; }
  #hint { display: none; }
  .tools { margin-left: 0; }
}
</style>
</head>
<body>
<div id="viewport"><div id="world"><svg id="edges"></svg></div></div>
<div id="bar">
  <div class="brand">RSI 面板<small id="host"></small></div>
  <div class="pills" id="pills"></div>
  <input id="search" placeholder="搜索标题、目标、路径" autocomplete="off">
  <div class="tools">
    <span id="conn">连接中…</span>
    <button id="fit" title="适配全部（F）">适配全部</button>
    <button id="zout" title="缩小">−</button><span id="zoom">100%</span><button id="zin" title="放大">+</button>
  </div>
</div>
<div id="hint">滚轮缩放 · 拖动平移 · 双击卡片聚焦 · 放大到一定程度显示每轮每个阶段 · 点击看详情</div>
<div id="empty"><div>没有找到 loop。<br>用 <code>rsi viz &lt;目录&gt;</code> 指向含 <code>status.yaml</code> 或 <code>iter-*/</code> 的 run 目录。</div></div>
<aside id="drawer"><header><div class="ttl"><b id="dtitle"></b><small id="dpath"></small></div><button class="x" id="dclose" title="关闭（Esc）">×</button></header><div id="dbody"></div></aside>

<script>
"use strict";
const STAGES = ["observe", "reasoning", "decision", "action", "feedback"];
const STAGE_ZH = { observe: "观察", reasoning: "推理", decision: "决策", action: "行动", feedback: "反馈" };
const STATES = {
  running: "运行中", done: "完成", stopped: "已停止", failed: "失败", lost: "失联", unknown: "无状态",
};
const CW = 600, CH = 400, GAP = 56, NW = 440, NH = 270;
const LOD_FAR = 0.4, LOD_NEAR = 1.3;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const stColor = (st) => `var(--${STATES[st] ? st : "unknown"})`;
const store = { get(k) { try { return JSON.parse(localStorage.getItem("rsi-viz:" + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("rsi-viz:" + k, JSON.stringify(v)); } catch { /* 无痕模式等 */ } } };

let data = { loops: [], nodes: [] };
let layoutKey = "";
let pos = {};            // id → {x, y, w, h}
let bounds = { x: 0, y: 0, w: 1, h: 1 };
let view = store.get("view") || null;
let hiddenStates = new Set(store.get("hidden") || []);
let query = "";
const details = {};      // loop id → 摘要 detail
const detailAt = {};
let sel = null;          // {id, iter, stage, tab}
let full = null;

// ---------- 画布：平移、缩放 ----------
const vp = $("#viewport"), world = $("#world");
function apply() {
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
  const lod = view.k < LOD_FAR ? "lod-far" : view.k < LOD_NEAR ? "lod-mid" : "lod-near";
  if (!world.classList.contains(lod)) { world.classList.remove("lod-far", "lod-mid", "lod-near"); world.classList.add(lod); }
  $("#zoom").textContent = Math.round(view.k * 100) + "%";
  store.set("view", view);
  scheduleDetails();
}
function zoomAt(cx, cy, factor) {
  const k = Math.min(5, Math.max(0.04, view.k * factor));
  view.x = cx - (cx - view.x) * (k / view.k);
  view.y = cy - (cy - view.y) * (k / view.k);
  view.k = k; apply();
}
function fitRect(r, pad = 60) {
  const W = vp.clientWidth, H = vp.clientHeight - 60;
  const k = Math.min(5, Math.max(0.04, Math.min((W - pad * 2) / r.w, (H - pad * 2) / r.h)));
  view = { k, x: (W - r.w * k) / 2 - r.x * k, y: 60 + (H - r.h * k) / 2 - r.y * k };
  apply();
}
function animateTo(r) {
  const from = { ...view }; fitRect(r); const to = { ...view }; view = from;
  const t0 = performance.now();
  const step = (t) => {
    const p = Math.min(1, (t - t0) / 260), e = 1 - Math.pow(1 - p, 3);
    view = { k: from.k * Math.pow(to.k / from.k, e), x: from.x + (to.x - from.x) * e, y: from.y + (to.y - from.y) * e };
    apply(); if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
vp.addEventListener("wheel", (e) => {
  e.preventDefault();
  const d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  zoomAt(e.clientX, e.clientY, Math.exp(-d * (e.ctrlKey ? 0.01 : 0.0016)));
}, { passive: false });
let drag = null;
vp.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false, id: e.pointerId };
});
window.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) > 4) { drag.moved = true; vp.classList.add("dragging"); vp.setPointerCapture(drag.id); }
  if (drag.moved) { view.x = drag.vx + dx; view.y = drag.vy + dy; apply(); }
});
window.addEventListener("pointerup", () => {
  if (drag && drag.moved) { vp.classList.remove("dragging"); suppressClick = true; setTimeout(() => (suppressClick = false), 0); }
  drag = null;
});
let suppressClick = false;
vp.addEventListener("click", (e) => {
  if (suppressClick) return;
  const cell = e.target.closest(".cell");
  const card = e.target.closest(".card");
  const node = e.target.closest(".node");
  if (cell && card) openDrawer(card.dataset.id, +cell.dataset.iter, cell.dataset.stage);
  else if (card) openDrawer(card.dataset.id);
  else if (node) { const n = data.nodes.find((x) => x.key === node.dataset.key); if (n) openNode(n); }
});
vp.addEventListener("dblclick", (e) => {
  const el = e.target.closest(".card, .node"); if (!el) return;
  const p = pos[el.dataset.id || el.dataset.key]; if (p) animateTo({ x: p.x - 20, y: p.y - 20, w: p.w + 40, h: p.h + 40 });
});
$("#fit").onclick = () => animateTo(bounds);
$("#zin").onclick = () => zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, 1.3);
$("#zout").onclick = () => zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, 1 / 1.3);
window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "Escape") closeDrawer();
  if (e.key === "f" || e.key === "F") animateTo(bounds);
});
$("#search").addEventListener("input", (e) => { query = e.target.value.trim().toLowerCase(); filter(); });
window.addEventListener("resize", () => scheduleDetails());

// ---------- 布局 ----------
function groupsOf(loops) {
  const g = new Map();
  for (const l of loops) { const k = l.group || "(未分组)"; if (!g.has(k)) g.set(k, []); g.get(k).push(l); }
  for (const v of g.values()) v.sort((a, b) => String(a.title).localeCompare(String(b.title)));
  return [...g.entries()].sort((a, b) => a[0].localeCompare(b[0]));
}
function layout() {
  const key = JSON.stringify([data.loops.map((l) => l.id + "|" + l.group), data.nodes.map((n) => n.key + "|" + n.parent)]);
  if (key === layoutKey) return false;
  layoutKey = key;
  pos = {};
  for (const el of world.querySelectorAll(".card, .node, .glabel")) el.remove();
  let y = 0, maxX = 0;
  // 节点树：深度 → 列，DFS 顺序 → 行
  if (data.nodes.length) {
    const kids = new Map(); const roots = [];
    for (const n of data.nodes) { if (n.parent && data.nodes.some((m) => m.key === n.parent)) { if (!kids.has(n.parent)) kids.set(n.parent, []); kids.get(n.parent).push(n); } else roots.push(n); }

  const it = its.find((x) => x.iteration === sel.iter);
  const inner = (full.inner || {})[String(sel.iter)] || [];
  s += `<div class="tabs" id="stabs">${STAGES.map((st) => `<button data-s="${st}" class="${sel.tab === "stage" && st === sel.stage ? "on" : ""}${it && it.stages[st] && !it.stages[st].pending ? "" : " miss"}">${STAGE_ZH[st]} ${st}</button>`).join("")}${inner.length ? `<button data-s="__inner" class="${sel.tab === "inner" ? "on" : ""}">内部过程 · ${inner.length}</button>` : ""}</div>`;
  if (sel.tab === "inner") {
    s += inner.map((e) => `<div class="ev ${esc(e.kind)}"><span class="kind">${esc(e.kind)}</span><span class="txt">${esc(e.text)}</span>${e.detail ? `<details><summary>展开</summary><pre>${esc(e.detail)}</pre></details>` : ""}</div>`).join("");
  } else {
    const e = it && it.stages[sel.stage] && !it.stages[sel.stage].pending ? it.stages[sel.stage] : null;
    const pend = it && it.stages[sel.stage] && it.stages[sel.stage].pending ? it.stages[sel.stage].note : "";
    if (pend) s += `<p>${esc(pend)}</p>`;
    s += e ? `${e.note ? `<p>${esc(e.note)}</p>` : ""}<div class="muted" style="font-size:12px;margin-bottom:4px">写入于 ${esc(e.mtime)}</div><pre class="y">${esc(e.yaml)}</pre>` : `<div class="muted">${l.state === "running" && l.iteration === sel.iter && l.stage === sel.stage ? "这个阶段正在运行，还没有输出" : "没有这个阶段的输出"}</div>`;
  }
  s += "</div>";
  body.innerHTML = s; body.scrollTop = scroll;
  for (const b of body.querySelectorAll("#itabs button")) b.onclick = () => { sel.iter = +b.dataset.i; drawDrawer(); };
  for (const b of body.querySelectorAll("#stabs button")) b.onclick = () => { if (b.dataset.s === "__inner") sel.tab = "inner"; else { sel.tab = "stage"; sel.stage = b.dataset.s; } body.scrollTop = 0; drawDrawer(); };
}

let needFit = !view;
if (!view) view = { k: 0.5, x: 40, y: 80 };
apply();
poll();
</script>
</body>
</html>
